name: Build watch face
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        id: build
        working-directory: hifi-watchface
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Collect output
        if: always()
        run: |
          mkdir -p dist
          cp hifi-watchface/build.log dist/build.log || true
          cp hifi-watchface/app/build/outputs/apk/release/app-release.apk dist/HiFiStereo-release.apk || true
          cp hifi-watchface/app/build/outputs/apk/debug/app-debug.apk dist/HiFiStereo-debug.apk || true
          # keep log small
          tail -n 200 dist/build.log > dist/build-tail.log || true
          rm -f dist/build.log
      - name: Publish to dist branch
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan watchface-dist
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f dist
          git commit -m "Build output [skip ci]"
          git push -f origin watchface-dist
