name: Build watch faces
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build all faces
        run: |
          mkdir -p dist
          for d in hifi-watchface pulse-digital rj-watchface rj-t1 rj-t2; do
            (cd $d && gradle assembleRelease --no-daemon 2>&1 | grep -vE '^\s+at ' | tail -n 80 > ../dist/$d-build-tail.log) || true
            cp $d/app/build/outputs/apk/release/app-release.apk dist/$d-release.apk || true
          done
      - name: Publish to dist branch
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan watchface-dist
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f dist
          git commit -m "Build output [skip ci]"
          git push -f origin watchface-dist
